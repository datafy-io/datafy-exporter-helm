image:
  repository: public.ecr.aws/datafy-io/datafy-exporter
  # tag defaults to .Chart.AppVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

port: 9908

# hostPort exposes the metrics port on the node's network interface.
# Disable if Prometheus scrapes via pod IP (recommended).
hostPort:
  enabled: true

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 32Mi
