image:
  repository: public.ecr.aws/datafy-io/datafy-exporter
  # tag defaults to .Chart.AppVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

# Agent state base on the host. Empty auto-detects Bottlerocket then /var/lib/datafy.
stateDir: ""

port: 9908

# Service for Prometheus to scrape via pod IP (recommended over hostPort).
service:
  enabled: true
  type: ClusterIP
  # Set to "None" for a headless service (direct pod DNS).
  clusterIP: ""
  annotations: {}
  labels: {}

# hostPort exposes the metrics port directly on the node's network interface.
# Disable when using the Service above (recommended).
hostPort:
  enabled: false

serviceAccount:
  create: true
  # Defaults to the fullname of the release when empty.
  name: ""
  annotations: {}

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 32Mi
