image:
  repository: public.ecr.aws/datafy-io/datafy-exporter
  # tag defaults to .Chart.AppVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

port: 9908

# hostPID required for the exporter to read host process/namespace metadata
hostPID: true

# hostPort exposes the metrics port on the node's network interface.
# Disable if Prometheus scrapes via pod IP (recommended).
hostPort:
  enabled: false

stateDirPath: /var/lib/datafy/pipes

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 32Mi
