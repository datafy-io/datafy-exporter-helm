name: Helm CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: Helm lint and template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@0697c8e2d5a705b86834a17ed8d5d2a996d3a464 # v5
        with:
          version: v4.3.2
      - name: Lint chart
        run: helm lint --strict .
      - name: Render default configuration
        run: helm template exporter . --namespace datafy > "$RUNNER_TEMP/exporter-default.yaml"
      - name: Render override configuration
        run: |
          helm template exporter . --namespace datafy \
            --set image.tag=ci-validation \
            --set stateDir=/run/custom-datafy-state \
            --set port=9100 \
            --set hostPort.enabled=true \
            --set service.enabled=false \
            --set serviceAccount.create=false \
            --set serviceAccount.name=existing-exporter \
            > "$RUNNER_TEMP/exporter-overrides.yaml"
      - name: Check host state access
        run: |
          grep -qF 'mountPropagation: HostToContainer' "$RUNNER_TEMP/exporter-default.yaml"
          if grep -qF 'datafy-pipes-state' "$RUNNER_TEMP/exporter-default.yaml" "$RUNNER_TEMP/exporter-overrides.yaml"; then
            echo 'Geometry state must use the host-root mount'
            exit 1
          fi
          grep -qF 'value: "/run/custom-datafy-state"' "$RUNNER_TEMP/exporter-overrides.yaml"
      # release.yml only runs on master; this catches a helm-s3 / Helm incompatibility on the PR.
      # Keep the plugin version in step with HELM_S3_VERSION in release.yml.
      - name: Check the release plugin loads
        run: |
          helm plugin install https://github.com/hypnoglow/helm-s3.git --version 0.17.2 --verify=false
          helm s3 version
