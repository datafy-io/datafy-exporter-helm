name: Release Chart

# Publishes the chart to the public Helm repository at https://helm.datafy.io/datafy-exporter
# (S3 bucket helm.datafy.io in the production account, served by CloudFront), the same way
# datafy-agent-helm publishes to /datafy-agent. Customers need no GitHub access to install it.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write # OIDC to assume the production AWS role
  contents: read

# Two releases updating index.yaml at once would lose one of the entries.
concurrency:
  group: release-chart
  cancel-in-progress: false

env:
  CHART_NAME: datafy-exporter
  S3_REPO: s3://helm.datafy.io/datafy-exporter
  PUBLIC_REPO: https://helm.datafy.io/datafy-exporter
  HELM_S3_VERSION: 0.17.2

jobs:
  release:
    name: Publish chart to helm.datafy.io
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials (production)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ secrets.PRODUCTION_AWS_ROLE_ARN }}

      # Pinned to Helm 3: Helm 4 refuses unverifiable git-sourced plugins like helm-s3.
      - name: Set up Helm
        uses: azure/setup-helm@0697c8e2d5a705b86834a17ed8d5d2a996d3a464 # v5
        with:
          version: v3.19.0

      - name: Read chart version
        id: chart
        run: |
          version=$(awk '$1 == "version:" {print $2}' Chart.yaml | tr -d "\"'")
          if [ -z "$version" ]; then
            echo "::error::Could not read version from Chart.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lint and package chart
        run: |
          helm lint --strict .
          helm package . --destination "$RUNNER_TEMP/dist"

      - name: Add the S3 Helm repository
        run: |
          helm plugin install https://github.com/hypnoglow/helm-s3.git --version "$HELM_S3_VERSION"
          # Creates index.yaml on the first release; a no-op afterwards.
          helm s3 init --ignore-if-exists "$S3_REPO"
          helm repo add datafyio-s3 "$S3_REPO"

      - name: Push chart
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          if helm search repo "datafyio-s3/$CHART_NAME" --version "$CHART_VERSION" --output json \
              | grep -q "\"version\":\"$CHART_VERSION\""; then
            echo "::notice::$CHART_NAME $CHART_VERSION is already published; nothing pushed. Bump version in Chart.yaml to release chart changes."
          else
            helm s3 push "$RUNNER_TEMP/dist/$CHART_NAME-$CHART_VERSION.tgz" datafyio-s3 --relative
            echo "::notice::Published $CHART_NAME $CHART_VERSION to $PUBLIC_REPO"
          fi

      # The customer's path: anonymous HTTPS, no AWS or GitHub credentials. Fails the release if the
      # chart cannot be fetched from the public URL, so a run can no longer succeed and publish nothing.
      - name: Verify the chart installs from the public repository
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          helm repo add datafyio "$PUBLIC_REPO"
          helm repo update datafyio
          helm template "$CHART_NAME" "datafyio/$CHART_NAME" --version "$CHART_VERSION" --namespace datafy > /dev/null
          echo "Verified: helm install $CHART_NAME datafyio/$CHART_NAME --version $CHART_VERSION"
