name: Release Chart

# Publishes the chart to the public Helm repository at https://helm.datafy.io/datafy-exporter
# (S3 bucket helm.datafy.io in the production account, served by CloudFront), next to the agent
# chart under /datafy-agent. Customers need no GitHub access to install it.
#
# The repository is a plain Helm repository built with `helm repo index` and the AWS CLI. The
# helm-s3 plugin that datafy-agent-helm uses does not provide its `helm s3` command on Helm 4.

# Manual only: run it from the Actions tab (or `gh workflow run release.yml --ref master`) once the
# chart on master is ready to ship. Merging to master does not publish anything.
on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC to assume the production AWS role
  contents: read

# Two releases updating index.yaml at once would lose one of the entries.
concurrency:
  group: release-chart
  cancel-in-progress: false

env:
  CHART_NAME: datafy-exporter
  S3_BUCKET: helm.datafy.io
  S3_PREFIX: datafy-exporter
  PUBLIC_REPO: https://helm.datafy.io/datafy-exporter

jobs:
  release:
    name: Publish chart to helm.datafy.io
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Charts are released from master only; this run was started on '$GITHUB_REF_NAME'."
          exit 1

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials (production)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ secrets.PRODUCTION_AWS_ROLE_ARN }}

      - name: Set up Helm
        uses: azure/setup-helm@0697c8e2d5a705b86834a17ed8d5d2a996d3a464 # v5
        with:
          version: v4.3.2

      - name: Read chart version
        id: chart
        run: |
          version=$(awk '$1 == "version:" {print $2}' Chart.yaml | tr -d "\"'")
          if [ -z "$version" ]; then
            echo "::error::Could not read version from Chart.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lint and package chart
        run: |
          helm lint --strict .
          helm package . --destination "$RUNNER_TEMP/dist"

      # Only a definite "not found" counts as the first release. Any other failure stops the run:
      # publishing without the current index would drop every earlier version from it.
      - name: Fetch the published index
        id: index
        run: |
          key="$S3_PREFIX/index.yaml"
          if aws s3api head-object --bucket "$S3_BUCKET" --key "$key" > /dev/null 2> "$RUNNER_TEMP/head.err"; then
            aws s3 cp "s3://$S3_BUCKET/$key" "$RUNNER_TEMP/published-index.yaml"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q -E '\(404\)|Not Found' "$RUNNER_TEMP/head.err"; then
            echo "::notice::No index at s3://$S3_BUCKET/$key yet; this is the first release."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/head.err"
            echo "::error::Could not read s3://$S3_BUCKET/$key"
            exit 1
          fi

      - name: Publish chart
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          INDEX_EXISTS: ${{ steps.index.outputs.exists }}
        run: |
          package="$CHART_NAME-$CHART_VERSION.tgz"
          if [ "$INDEX_EXISTS" = "true" ] \
              && yq ".entries[\"$CHART_NAME\"][].version" "$RUNNER_TEMP/published-index.yaml" | grep -Fxq "$CHART_VERSION"; then
            echo "::notice::$CHART_NAME $CHART_VERSION is already published; nothing pushed. Bump version in Chart.yaml to release chart changes."
            exit 0
          fi

          # No --url: entries get relative URLs, which resolve against whatever host serves the index.
          if [ "$INDEX_EXISTS" = "true" ]; then
            helm repo index "$RUNNER_TEMP/dist" --merge "$RUNNER_TEMP/published-index.yaml"
          else
            helm repo index "$RUNNER_TEMP/dist"
          fi

          # Package first, index last, so the index never lists a chart that is not there yet.
          aws s3 cp "$RUNNER_TEMP/dist/$package" "s3://$S3_BUCKET/$S3_PREFIX/$package" --content-type application/gzip
          aws s3 cp "$RUNNER_TEMP/dist/index.yaml" "s3://$S3_BUCKET/$S3_PREFIX/index.yaml" --content-type application/yaml
          echo "::notice::Published $CHART_NAME $CHART_VERSION to $PUBLIC_REPO"

      # The customer's path: anonymous HTTPS, no AWS or GitHub credentials. Fails the release if the
      # chart cannot be fetched from the public URL, so a run can no longer succeed and publish nothing.
      - name: Verify the chart installs from the public repository
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm repo add datafyio "$PUBLIC_REPO"
          helm repo update datafyio
          helm template "$CHART_NAME" "datafyio/$CHART_NAME" --version "$CHART_VERSION" --namespace datafy > /dev/null
          echo "Verified: helm install $CHART_NAME datafyio/$CHART_NAME --version $CHART_VERSION"
