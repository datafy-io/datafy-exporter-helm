apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "datafy-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datafy-exporter.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "datafy-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "datafy-exporter.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "datafy-exporter.serviceAccountName" . }}
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: datafy-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATAFY_EXPORTER_HOST_ROOT
              value: /host
            {{- with .Values.stateDir }}
            - name: DATAFY_STATE_DIR
              value: {{ . | quote }}
            {{- end }}
          args:
            - "-port={{ .Values.port }}"
          ports:
            - name: metrics
              containerPort: {{ .Values.port }}
              {{- if .Values.hostPort.enabled }}
              hostPort: {{ .Values.port }}
              {{- end }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            timeoutSeconds: 6
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            timeoutSeconds: 6
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
