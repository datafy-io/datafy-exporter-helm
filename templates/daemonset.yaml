apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: datafy-exporter
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: datafy-exporter
  template:
    metadata:
      labels:
        app: datafy-exporter
    spec:
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: datafy-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-port={{ .Values.port }}"
          ports:
            - name: metrics
              containerPort: {{ .Values.port }}
              {{- if .Values.hostPort.enabled }}
              hostPort: {{ .Values.port }}
              {{- end }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
            - name: datafy-pipes-state
              mountPath: /var/lib/datafy/pipes
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: datafy-pipes-state
          hostPath:
            path: /var/lib/datafy/pipes
            type: DirectoryOrCreate
